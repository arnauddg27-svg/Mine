# Channel identity: the handle is the on-screen watermark and the "Follow @handle" line in descriptions.
channel:
  handle: "@dailydrive"      # set to "" to hide the watermark
  language: en

# clips  = cut moments from long talks/podcasts by the speakers in sources.yaml (needs a home connection: see README)
# quotes = narrated public-domain quotes over stock footage (runs anywhere, including GitHub Actions)
mode: clips

clips:
  sources_file: sources.yaml
  min_seconds: 20              # clip length bounds
  max_seconds: 58
  candidates_per_video: 5      # moments picked per source video (each run posts the next unused one)
  picker: claude               # claude (needs ANTHROPIC_API_KEY, ~10-30 cents per source video) | heuristic (free, weaker)
  picker_effort: high
  whisper_model: base.en       # speech-to-text: tiny.en (fast) | base.en | small.en (more accurate, ~3x slower)
  layout: auto                 # auto = follow the face when one speaker fills the frame, else fit with blurred bars | crop | fit
  hook_overlay: true           # boxed headline at the top for the whole clip
  show_speaker: true           # "— Speaker Name" under the captions
  caption_y: 0.66              # caption height as a fraction of the frame (below the face, above the Shorts title)
  font_size: 76                # caption size for clips (quote videos use captions.font_size)
  heuristic_hooks: false       # with picker: heuristic, show the detected topic as the headline
  loudness: -14                # LUFS target for the clip audio (YouTube's playback level)
  max_height: 1080             # source download resolution cap
  max_videos_per_channel: 15   # newest uploads considered per channel entry
  min_source_seconds: 180      # ignore a channel's own Shorts and trailers
  music: false                 # add a quiet ducked bed from assets/music
  cookies_file: ""             # optional browser cookies.txt for yt-dlp (see README before using)

# Quote mode only: where the words come from.
script:
  source: bank               # bank = public-domain quotes | claude = original AI scripts | mixed = both
  hook: true                 # speak a short attention line before the quote
  cta:                       # one is picked per video; "" or [] to disable
    - "Follow for your daily dose of motivation."
    - "Follow for one of these every day."
    - "Save this one for later."
  max_quote_words: 36

# Optional Claude script writer (needs ANTHROPIC_API_KEY; only used when script.source is claude/mixed).
llm:
  model: claude-opus-5-5
  effort: medium
  mixed_ratio: 0.5
  themes:
    - discipline when motivation fades
    - starting before you feel ready
    - consistency over intensity
    - handling failure without quitting
    - comparison and running your own race
    - doing the boring work
    - mornings and how you start the day
    - patience with slow progress
    - fear of judgment
    - finishing what you start

# Voice (run `python -m motivate voices` to list options).
voice:
  name: en-US-GuyNeural      # calm male; try en-US-ChristopherNeural, en-GB-RyanNeural, en-US-AriaNeural
  # names: [en-US-GuyNeural, en-US-ChristopherNeural, en-GB-RyanNeural]   # uncomment to rotate voices per video
  rate: "-6%"
  pitch: "-2Hz"
  pause_after:               # seconds of silence after each segment
    hook: 0.55
    quote: 0.7
    body: 0.6
    cta: 0.2
  default_pause: 0.5

captions:
  style: karaoke             # karaoke = current word highlighted | block = plain pages
  font: Inter                # bundled in assets/fonts
  font_size: 92
  words_per_page: 3
  uppercase: true
  text_color: "FFFFFF"
  highlight_color: "FFD600"
  outline_color: "000000"
  pop_scale: 108
  time_offset: 0.0           # seconds; positive delays captions (TTS timestamps run ~0.1 s early)
  show_author: true
  show_brand: true

background:
  sources: [pexels, local, gradient]   # tried in order; gradient always works offline
  queries:                              # Pexels search terms (portrait stock video)
    - mountain sunrise aerial
    - ocean waves slow motion
    - city night rain
    - forest fog
    - runner training dawn
    - storm clouds timelapse
    - highway night lights
    - snow mountain drone
    - gym workout dark
    - campfire night
  tag_queries:                          # used instead of the list above when the quote's theme matches
    resilience: [storm clouds timelapse, waves crashing rocks, mountain climber]
    persistence: [runner training dawn, long road aerial, rowing sunrise]
    courage: [cliff edge ocean, snow mountain drone, lightning storm]
    discipline: [gym workout dark, boxing training, early morning city]
    patience: [forest fog, river slow motion, snowfall night]
    action: [highway night lights, city timelapse, sprint start]
    mindset: [calm lake reflection, clouds timelapse, sunrise meditation]
    fear: [fog forest path, dark ocean night, thunderstorm]
    time: [clock tower timelapse, hourglass sand, sunset timelapse]
    procrastination: [city sunrise timelapse, alarm clock morning, hourglass sand]
    work: [workshop hands crafting, blacksmith forge, construction site sunrise]
    wisdom: [ancient library, old stone temple, starry night sky]
    growth: [plant growing timelapse, forest canopy aerial, seedling sunlight]
    purpose: [lighthouse night, mountain summit sunrise, compass map]
    preparation: [mountaineer gear, chess board, rowing team training]
    gratitude: [golden hour field, sunlight through trees, calm sea sunset]
    dreams: [milky way night sky, hot air balloons sunrise, northern lights]
    perspective: [aerial city grid, earth from space, mountain valley clouds]
    responsibility: [lighthouse storm, captain ship wheel, mountain guide rope]
    passion: [fire embers slow motion, dancer silhouette, concert lights]
  pexels_pages: 3                       # random result page 1..N for more variety
  cache_keep: 24                        # downloaded clips kept in .cache (oldest pruned)
  # local_dir: assets/backgrounds       # folder scanned by the "local" source

music:
  enabled: true              # drop royalty-free tracks into assets/music (mp3/wav) and commit them
  volume: 0.18               # level between phrases
  duck: true                 # dip the music about 8 dB while the voice speaks
  # dir: assets/music        # override the music folder

video:
  width: 1080
  height: 1920
  fps: 30
  tail_seconds: 0.8
  max_seconds: 59
  crf: 19
  preset: medium
  darken: 0.08
  render_timeout: 900        # seconds before a stuck ffmpeg render is killed

youtube:
  privacy: private           # private | unlisted | public. Start private, check a few uploads, then switch to public.
  category_id: "22"          # 22 = People & Blogs, 27 = Education, 24 = Entertainment
  title_suffix: " #shorts"
  tags: [motivation, motivational video, mindset, discipline, self improvement, daily motivation, shorts]   # per-quote tags are added automatically
  hashtags: [motivation, mindset, discipline, shorts]
  made_for_kids: false
  notify_subscribers: true
  ai_disclosure: true        # append a one-line AI voiceover note to descriptions
  synthetic_media_label: false   # also set YouTube's "altered or synthetic content" flag on each upload
